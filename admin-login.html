<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - UPI Surveillance</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
        body { background: linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%); color:#fff; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
        .login-container{width:100%;max-width:400px;}
        .logo{ text-align:center;margin-bottom:30px; }
        .logo i{font-size:50px;background:linear-gradient(120deg,#FCA5A5 0%,#F87171 50%,#DC2626 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        .logo h1{font-family:'Playfair Display',serif;font-size:32px;background:linear-gradient(120deg,#FCA5A5 0%,#F87171 50%,#DC2626 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        .login-card{background:rgba(255,255,255,.95);border-radius:20px;padding:40px;box-shadow:0 20px 60px rgba(220,38,38,.3);border:1px solid rgba(220,38,38,.2);}
        .form-group{margin-bottom:20px;}
        label{display:block;color:#DC2626;font-weight:600;margin-bottom:8px;font-size:14px;}
        .input-wrapper{position:relative;}
        input{width:100%;padding:14px 16px 14px 42px;border-radius:12px;border:2px solid #FECACA;font-size:14px;outline:none;transition:.3s;}
        .input-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#DC2626;font-size:16px;}
        input:focus{border-color:#DC2626;box-shadow:0 0 0 4px rgba(220,38,38,.1);background:#fafafa;color:#000;}
        .login-btn{width:100%;padding:14px;background:linear-gradient(120deg,#DC2626 0%,#EF4444 100%);color:#fff;border:none;border-radius:12px;font-weight:700;cursor:pointer;font-size:15px;transition:.3s;box-shadow:0 10px 25px rgba(220,38,38,.3);}
        .login-btn:hover{transform:translateY(-2px);box-shadow:0 15px 40px rgba(220,38,38,.4);}
        .error-message{background:linear-gradient(120deg,#EF4444,#F87171);color:white;padding:16px;border-radius:12px;margin-bottom:20px;display:none;align-items:center;gap:12px;}
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <i class="fas fa-shield-alt"></i>
            <h1>Admin Surveillance</h1>
        </div>
        <div class="login-card">
            <div class="error-message" id="errorMessage">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText">Invalid credentials.</span>
            </div>
            <form id="adminOnlyForm">
                <div class="form-group">
                    <label for="adminUsername">Username</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="adminUsername" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="adminPassword" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="adminSecret">Secret Key</label>
                    <div class="input-wrapper">
                        <i class="fas fa-key input-icon"></i>
                        <input type="password" id="adminSecret" required>
                    </div>
                </div>
                <button type="submit" class="login-btn">Login</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('adminOnlyForm').addEventListener('submit',function(e){
            e.preventDefault();
            const u=document.getElementById('adminUsername').value;
            const p=document.getElementById('adminPassword').value;
            const s=document.getElementById('adminSecret').value;
            if((u==='admin'&&p==='admin@123'&&s==='SECRET2026')||(u==='manager'&&p==='manager@123'&&s==='SECRET2026')){
                localStorage.setItem('userRole',u==='admin'?'admin':'manager');
                localStorage.setItem('userName',u.charAt(0).toUpperCase()+u.slice(1));
                window.location.href='admin-dashboard.html';
            }else{
                const err=document.getElementById('errorMessage');
                document.getElementById('errorText').textContent='Invalid credentials or key';
                err.style.display='flex';
            }
        });
    </script>
</body>
</html>
